<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointillism Lily</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(4, 2, 10);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: rgb(4, 2, 10);
            box-shadow: 0 0 20px rgba(255, 192, 203, 0.2);
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="lilyCanvas" width="720" height="1280"></canvas>

    <script>
        const canvas = document.getElementById('lilyCanvas');
        const ctx = canvas.getContext('2d');

        const W = 720;
        const H = 1280;
        const T_STEM = 4.0;
        const T_B0 = 5.0;
        const T_B1 = 15.0;
        const S = W / 720.0;
        const gx = W / 2;
        const gy = H * 0.82;
        const HS = 380 * S;

        function createSeededRandom(seed) {
            let m = 0x80000000;
            let a = 1103515245;
            let c = 12345;
            let state = seed ? seed : Math.floor(Math.random() * (m - 1));
            return function() {
                state = (a * state + c) % m;
                return state / (m - 1);
            };
        }
        const random = createSeededRandom(11);
        
        function randomNormal() {
            let u = 0, v = 0;
            while(u === 0) u = random();
            while(v === 0) v = random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        function smooth(x) {
            x = Math.max(0, Math.min(1, x));
            return x * x * (3 - 2 * x);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function midrib(L, a0, curl, K = 40) {
            let us = [];
            let al = [];
            for (let i = 0; i <= K; i++) {
                let u = i / K;
                us.push(u);
                al.push(a0 + curl * Math.pow(u, 1.6));
            }
            let ds = L / K;
            let r = [0];
            let h = [0];
            
            let current_r = 0;
            let current_h = 0;
            for (let i = 1; i <= K; i++) {
                current_r += Math.sin(al[i]) * ds;
                current_h += Math.cos(al[i]) * ds;
                r.push(current_r);
                h.push(current_h);
            }
            return { us, r, h };
        }

        function interp(x, xp, fp) {
            if (x <= xp[0]) return fp[0];
            if (x >= xp[xp.length - 1]) return fp[fp.length - 1];
            for (let i = 0; i < xp.length - 1; i++) {
                if (x >= xp[i] && x <= xp[i+1]) {
                    let t = (x - xp[i]) / (xp[i+1] - xp[i]);
                    return lerp(fp[i], fp[i+1], t);
                }
            }
            return fp[0];
        }

        // Initialize Petals
        const NP = 2300;
        const petals = [];
        const stops = [0, 0.35, 0.7, 1];

        for (let k = 0; k < 6; k++) {
            let outer = (k % 2 === 0);
            let pu = [], pv = [], prof = [], base = [], keep = [];
            
            for (let i = 0; i < NP; i++) {
                let u_val = Math.pow(random(), 0.85);
                let v_val = random() * 2 - 1;
                pu.push(u_val);
                pv.push(v_val);
                prof.push(Math.pow(Math.sin(Math.PI * Math.pow(u_val, 0.7)), 0.9));
                keep.push(Math.abs(v_val) <= 1);

                let r_col = interp(u_val, stops, [205, 255, 255, 255]);
                let g_col = interp(u_val, stops, [40, 95, 150, 195]);
                let b_col = interp(u_val, stops, [125, 165, 205, 228]);

                if (Math.abs(v_val) < 0.07 && u_val < 0.55) {
                    r_col = 235; g_col = 225; b_col = 150;
                } else if (random() < 0.10 && u_val < 0.6 && Math.abs(v_val) < 0.75) {
                    r_col = 140; g_col = 15; b_col = 80;
                }
                if (Math.abs(v_val) > 0.88) {
                    r_col *= 1.08; g_col *= 1.08; b_col *= 1.08;
                }

                let factor = (0.82 + 0.35 * random());
                base.push([r_col * factor, g_col * factor, b_col * factor]);
            }

            petals.push({
                phi: (k * 60 + 8) * Math.PI / 180,
                L: (outer ? 300 : 280) * S,
                Wm: (outer ? 64 : 72) * S,
                ac: outer ? 0.10 : 0.05,
                ao: outer ? 1.05 : 0.82,
                curl: outer ? 0.95 : 0.75,
                pu, pv, prof, base, keep
            });
        }

        // Initialize Stem Particles
        const NS = 3200;
        const st_s = [], st_dx = [], st_col = [];
        for (let i = 0; i < NS; i++) {
            let s_val = random();
            st_s.push(s_val);
            st_dx.push(randomNormal() * (3.2 * S) * (1 - 0.5 * s_val));
            let r_c = lerp(40, 120, s_val);
            let g_c = lerp(150, 215, s_val);
            let b_c = lerp(95, 120, s_val);
            let f = 0.8 + 0.4 * random();
            st_col.push([r_c * f, g_c * f, b_c * f]);
        }

        // Initialize Leaves
        const leaves = [];
        const leafData = [[0.10, 190, 1], [0.24, 175, -1], [0.40, 150, 1], [0.56, 120, -1]];
        leafData.forEach(([s0, Lf, side]) => {
            let n = 900;
            let u = [], v = [], prof = [], col = [];
            for (let i = 0; i < n; i++) {
                let u_val = Math.pow(random(), 0.9);
                let v_val = random() * 2 - 1;
                u.push(u_val);
                v.push(v_val);
                prof.push(Math.pow(Math.sin(Math.PI * Math.pow(u_val, 0.8)), 0.8));
                
                let r_c = lerp(40, 140, u_val);
                let g_c = lerp(160, 235, u_val);
                let b_c = lerp(100, 140, u_val);
                if (Math.abs(v_val) < 0.08) {
                    r_c = 190; g_c = 240; b_c = 170;
                }
                let f = 0.8 + 0.4 * random();
                col.push([r_c * f, g_c * f, b_c * f]);
            }
            leaves.push({ s0, L: Lf * S, side, u, v, prof, col });
        });

        // Initialize Soil Mound
        const NG = 5000;
        const so_dx = [], so_y = [], so_col = [];
        for (let i = 0; i < NG; i++) {
            let dx = (random() * 680 - 340) * S;
            so_dx.push(dx);
            let mound = (1 - Math.pow(dx / (340 * S), 2)) * 55 * S;
            let y = gy - mound * Math.pow(random(), 0.5) + randomNormal() * 1.5;
            so_y.push(y);
            let f = 0.8;
            so_col.push([
                lerp(70, 140, random()) * f,
                lerp(55, 100, random()) * f,
                lerp(80, 120, random()) * f
            ]);
        }

        // Background Particles
        const ND = 450;
        const d_x = [], d_y = [], d_sp = [], d_ph = [], d_f = [];
        for (let i = 0; i < ND; i++) {
            d_x.push(random() * W);
            d_y.push(random() * H);
            d_sp.push((random() * 16 + 6) * S);
            d_ph.push(random() * 6.28);
            d_f.push(random() * 3 + 1);
        }

        const ang_ring = Array.from({length: 1100}, () => random() * 6.28);
        const ang_c = Array.from({length: 6}, () => Array.from({length: 260}, () => random() * 6.28));

        // Floating Sparks
        const NF = 140;
        const f_off = [], f_ph = [], f_dr = [], f_sp = [];
        for (let i = 0; i < NF; i++) {
            f_off.push(random());
            f_ph.push(random() * 6.28);
            f_dr.push((random() * 160 - 80) * S);
            f_sp.push(random() * 0.07 + 0.05);
        }

        // Stamens
        const stam = [];
        for (let k = 0; k < 6; k++) {
            let jit = Array.from({length: 45}, () => randomNormal());
            let an = Array.from({length: 35}, () => [randomNormal(), randomNormal()]);
            stam.push({ phi: (k * 60 + 38) * Math.PI / 180, jit, an });
        }

        function stem_x(s, t) {
            let sway = 10 * S * Math.sin(0.9 * t);
            return gx + 30 * S * Math.sin(2.2 * s) + sway * s * s;
        }
        function stem_y(s) {
            return gy - s * HS;
        }

        let startTime = Date.now();

        function render() {
            let t = (Date.now() - startTime) / 1000.0;
            
            ctx.fillStyle = 'rgb(4, 2, 10)';
            ctx.fillRect(0, 0, W, H);

            let P = []; 

            let g = smooth(t / T_STEM);
            let e = smooth((t - T_B0) / (T_B1 - T_B0));
            let rev = smooth((t - T_STEM + 0.3) / 1.6);

            let hx = stem_x(1.0, t);
            let hy = stem_y(1.0);

            // Background Dust
            for (let i = 0; i < ND; i++) {
                let tw = 0.35 + 0.65 * (Math.sin(t * d_f[i] + d_ph[i]) > 0.2 ? 1 : 0);
                let yy = (d_y[i] - t * d_sp[i]) % H;
                if (yy < 0) yy += H;
                P.push({ x: d_x[i], y: yy, z: -1000, r: 255 * tw * 0.55, g: 200 * tw * 0.55, b: 235 * tw * 0.55 });
            }

            // Halo Rings
            let ha = smooth((t - T_B0 + 1.5) / 4.0) * 0.9;
            if (ha > 0.01) {
                let cx0 = hx, cy0 = hy - 90 * S;
                let R = 300 * S;
                let rot = t * 0.12;
                ang_ring.forEach(ang => {
                    let a = ang + rot;
                    P.push({ x: cx0 + R * Math.cos(a), y: cy0 + R * Math.sin(a), z: -900, r: 255 * ha * 0.7, g: 190 * ha * 0.7, b: 225 * ha * 0.7 });
                });
                ang_c.forEach((ac, k) => {
                    let ca = rot * 1.3 + k * Math.PI / 3;
                    let ox = cx0 + R * Math.cos(ca), oy = cy0 + R * Math.sin(ca);
ac.forEach(ang => {
let a = ang + rot;
P.push({ x: ox + R * 0.5 * Math.cos(a), y: oy + R * 0.5 * Math.sin(a), z: -900, r: 255 * ha * 0.45, g: 170 * ha * 0.45, b: 215 * ha * 0.45 });
});
});
}
// Ground Soil
for (let i = 0; i < NG; i++) {
P.push({ x: so_dx[i] + gx, y: so_y[i], z: -500, r: so_col[i][0], g: so_col[i][1], b: so_col[i][2] });
}
// Stem Growing
for (let i = 0; i < NS; i++) {
if (st_s[i] <= g) {
let s = st_s[i];
P.push({ x: stem_x(s, t) + st_dx[i], y: stem_y(s), z: -100, r: st_col[i][0], g: st_col[i][1], b: st_col[i][2] });
}
}
// Leaves Growing
leaves.forEach(lf => {
let lg = Math.max(0, Math.min(1, (g - lf.s0) * 2.5));
if (lg > 0.01) {
let L = lf.L * lg;
let m_data = midrib(L, 0.85, 1.1);
let bx = stem_x(lf.s0, t), by = stem_y(lf.s0);
let sway = Math.sin(t * 1.2 + lf.s0 * 5) * 0.03;
for (let i = 0; i < lf.u.length; i++) {
let rr = interp(lf.u[i], m_data.us, m_data.r);
let hh = interp(lf.u[i], m_data.us, m_data.h);
let wid = 15 * S * lf.prof[i] * lg;
let x = bx + lf.side * (rr + lf.v[i] * wid * 0.35) + sway * hh * lf.side;
let y = by - hh + lf.v[i] * wid;
P.push({ x, y, z: -90, r: lf.col[i][0], g: lf.col[i][1], b: lf.col[i][2] });
}
}
});
// Petals Blooming
if (rev > 0.01) {
let psi = 0.25 + t * 0.22, tau = 0.5;
let cp = Math.cos(psi), sp = Math.sin(psi);
let ct = Math.cos(tau), st = Math.sin(tau);
let sway_t = Math.sin(t * 0.8) * 0.02;
petals.forEach(p => {
let Ls = p.L * (0.45 + 0.55 * e) * (0.35 + 0.65 * rev);
let a0 = lerp(p.ac, p.ao, e);
let curl = (0.12 + 0.88 * e) * p.curl;
let m_data = midrib(Ls, a0, curl);
for (let i = 0; i < p.pu.length; i++) {
if (p.pu[i] <= rev && p.keep[i]) {
let rr = interp(p.pu[i], m_data.us, m_data.r);
let hh = interp(p.pu[i], m_data.us, m_data.h);
let wid = p.Wm * (0.55 + 0.45 * e) * p.prof[i] * (0.35 + 0.65 * rev);
let ph = p.phi;
let X = rr * Math.cos(ph) - p.pv[i] * wid * Math.sin(ph);
let Z = rr * Math.sin(ph) + p.pv[i] * wid * Math.cos(ph);
let Y = hh + Math.pow(p.pv[i], 2) * wid * (0.30 * (1 - e) - 0.25 * e);
let Xp = X * cp + Z * sp;
let Zp = -X * sp + Z * cp;
let sy = Y * ct - Zp * st;
let shade = 0.55 + 0.45 * Math.max(0, Math.min(1, Zp / p.L * 0.8 + 0.5));
let r_c = p.base[i][0], g_c = p.base[i][1], b_c = p.base[i][2];
let tint = (1 - e) * Math.max(0, Math.min(1, p.pu[i] * 1.3)) * 0.6;
r_c = r_c * (1 - tint) + 135 * tint;
g_c = g_c * (1 - tint) + 205 * tint;
b_c = b_c * (1 - tint) + 125 * tint;
P.push({ x: hx + Xp + sway_t * sy, y: hy - sy, z: Zp, r: r_c * shade, g: g_c * shade, b: b_c * shade });
}
}
});
// Stamens & Anthers
if (e > 0.28) {
let sr = smooth((e - 0.28) / 0.4);
stam.forEach(sdat => {
let Ls = 215 * S * (0.4 + 0.6 * e) * sr;
let m_data = midrib(Ls, lerp(0.15, 0.62, e), 0.55 * e);
let ph = sdat.phi;
for (let i = 0; i < 45; i++) {
let u_val = (i / 45);
let rr = interp(u_val, m_data.us, m_data.r);
let hh = interp(u_val, m_data.us, m_data.h);
let X = rr * Math.cos(ph), Z = rr * Math.sin(ph), Y = hh;
let Xp = X * cp + Z * sp, Zp = -X * sp + Z * cp;
let sy = Y * ct - Zp * st;
P.push({ x: hx + Xp, y: hy - sy, z: Zp + 5, r: 245, g: 235, b: 200 });
}
let tx = m_data.r[m_data.r.length - 1] * Math.cos(ph);
let tz = m_data.r[m_data.r.length - 1] * Math.sin(ph);
let ty = m_data.h[m_data.h.length - 1];
let txp = tx * cp + tz * sp, tzp = -tx * sp + tz * cp;
let tsy = ty * ct - tzp * st;
for (let i = 0; i < 35; i++) {
let an_x = sdat.an[i][0] * 5 * S;
let an_y = sdat.an[i][1] * 5 * S;
let f = 0.8 + 0.4 * (random());
P.push({
x: hx + txp + an_x * 1.6, y: hy - tsy + an_y * 0.7, z: tzp + 6,
r: 255 * f, g: 150 * f, b: 40 * f
});
}
});
}
}
// Floating Sparks
if (e > 0.6) {
let fa = smooth((e - 0.6) / 0.4);
for (let i = 0; i < NF; i++) {
let q = (t * f_sp[i] + f_off[i]) % 1.0;
let fx = hx + f_dr[i] * q + Math.sin(q * 7 + f_ph[i]) * 25 * S;
let fy = (hy - 110 * S) + q * (gy - hy + 90 * S);
let fade = (1 - q) * fa;
let r_c = f_ph[i] > 3.1 ? 255 : 255;
let g_c = f_ph[i] > 3.1 ? 190 : 150;
let b_c = f_ph[i] > 3.1 ? 80 : 205;
P.push({ x: fx, y: fy, z: 300, r: r_c * fade, g: g_c * fade, b: b_c * fade });
}
}
P.sort((a, b) => a.z - b.z);
P.forEach(p => {
let ix = Math.floor(p.x);
let iy = Math.floor(p.y);
if (ix >= 0 && ix < W - 2 && iy >= 0 && iy < H - 2) {
ctx.fillStyle = rgb(${Math.min(255, Math.max(0, p.r))}, ${Math.min(255, Math.max(0, p.g))}, ${Math.min(255, Math.max(0, p.b))});
ctx.fillRect(ix, iy, 2, 2);
}
});
ctx.globalCompositeOperation = 'screen';
ctx.drawImage(canvas, 0, 0, W, H);
ctx.globalCompositeOperation = 'source-over';
requestAnimationFrame(render);
}
render();
